name: Run Tests Job

on:
  workflow_call:
    secrets:
      MYSQL_DATABASE:
        required: true
      MYSQL_USER:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_ROOT_PASSWORD:
        required: true
    outputs:
      tests-passed:
        description: "Indique si les tests ont réussi"
        value: ${{ jobs.execute-tests.outputs.tests-passed }}
      unit-report:
        description: "Chemin du rapport unitaire"
        value: ${{ jobs.execute-tests.outputs.unit-report }}
      feature-report:
        description: "Chemin du rapport fonctionnel"
        value: ${{ jobs.execute-tests.outputs.feature-report }}

jobs:
  execute-tests:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Restore Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies if needed
        run: |
          if [ ! -d "vendor" ]; then
            echo "== Installation des dépendances Composer... =="
            composer install --no-scripts
          else
            echo "== Utilisation du cache Composer =="
          fi

      - name: Setup test environment
        run: |
            cp .env.example .env.testing
            php artisan key:generate --env=testing
            sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=mysql/" .env.testing
            sed -i "s/DB_HOST=.*/DB_HOST=127.0.0.1/" .env.testing
            sed -i "s/DB_PORT=.*/DB_PORT=3306/" .env.testing
            sed -i "s/DB_DATABASE=.*/DB_DATABASE=${{ secrets.MYSQL_DATABASE }}/" .env.testing
            sed -i "s/DB_USERNAME=.*/DB_USERNAME=${{ secrets.MYSQL_USER }}/" .env.testing
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}/" .env.testing

      - name: Wait for MySQL to be ready
        env:
          MYSQL_PWD: ${{ env.MYSQL_PASSWORD }}
        run: |
          echo "== Attente de MySQL... =="
          until mysqladmin -h 127.0.0.1 -u${{ env.MYSQL_USER }} ping 2>/dev/null; do
            echo "En attente de MySQL..."
            sleep 2
          done
          echo "== MySQL est prêt =="

      - name: Run Migrations
        run: php artisan migrate --env=testing

      - name: Run unit tests
        id: run-unit-tests
        run: |
            echo "== Lancement des tests unitaires (JSON) == "
            vendor/bin/phpunit --testsuite Unit --log-json unit-report.json
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-reports-json
          path: |
            unit-report.json
            feature-report.json
