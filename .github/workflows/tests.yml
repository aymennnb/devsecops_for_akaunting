name: Run Tests Job

on:
  workflow_call:
    secrets:
      MYSQL_DATABASE:
        required: true
      MYSQL_USER:
        required: true
      MYSQL_PASSWORD:
        required: true
      MYSQL_ROOT_PASSWORD:
        required: true
    outputs:
      tests-passed:
        description: "Indique si les tests ont réussi"
        value: ${{ jobs.execute-tests.outputs.tests-passed }}
      unit-report:
        description: "Chemin du rapport unitaire"
        value: ${{ jobs.execute-tests.outputs.unit-report }}
      feature-report:
        description: "Chemin du rapport fonctionnel"
        value: ${{ jobs.execute-tests.outputs.feature-report }}

jobs:
  execute-tests:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    outputs:
      tests-passed: ${{ steps.run-unit-tests.outcome == 'success' && steps.run-feature-tests.outcome == 'success' }}
      unit-report: unit-report.json
      feature-report: feature-report.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql

      - name: Restore Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies if needed
        run: |
          if [ ! -d "vendor" ]; then
            echo "== Installation des dépendances Composer... =="
            composer install --no-scripts --no-progress --prefer-dist
          else
            echo "== Utilisation du cache Composer =="
          fi

      - name: Setup test environment
        run: |
          echo "== Configuration du fichier .env.testing =="
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=mysql/" .env.testing
          sed -i "s/DB_HOST=.*/DB_HOST=127.0.0.1/" .env.testing
          sed -i "s/DB_PORT=.*/DB_PORT=3306/" .env.testing
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=${{ secrets.MYSQL_DATABASE }}/" .env.testing
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=${{ secrets.MYSQL_USER }}/" .env.testing
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}/" .env.testing
          # Désactive les interactions console
          echo "APP_ENV=testing" >> .env.testing

      - name: Wait for MySQL to be ready
        run: |
          echo "== Attente de la disponibilité du port 3306... =="
          # Utilise netcat pour vérifier que le port est ouvert sur 127.0.0.1
          timeout 60s sh -c 'until nc -z 127.0.0.1 3306; do echo "En attente..."; sleep 2; done'
          echo "== MySQL est prêt sur le port 3306 =="

      - name: Run Migrations
        run: php artisan migrate --env=testing --force

      - name: Run unit tests
        id: run-unit-tests
        run: |
          echo "== Lancement des tests unitaires == "
          vendor/bin/phpunit --testsuite Unit --log-junit unit-report.xml
        continue-on-error: true

      - name: Run feature tests
        id: run-feature-tests
        run: |
          echo "== Lancement des tests fonctionnels == "
          vendor/bin/phpunit --testsuite Feature --log-junit feature-report.xml
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-reports
          path: |
            unit-report.xml
            feature-report.xml
