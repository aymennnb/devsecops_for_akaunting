name: DAST Security with OWASP ZAP

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        required: true
        type: string
      DEFECTDOJO_ENGAGEMENT_ID:
        required: true
        type: string
    secrets:
      DEFECTDOJO_API_KEY:
        required: true

jobs:
  owasp-zap-dast:
    name: DAST Security with OWASP ZAP
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG_COMMIT: ${{ vars.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: ./

      - name: Load Docker image
        run: |
          echo "=== Loading Docker image ==="
          docker load -i docker-image.tar
          echo "== Docker image loaded =="
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }}

      - name: Start Docker container
        run: |
          echo "=== Starting Docker container ==="
          docker run -d \
            --name akaunting-app \
            -p 8080:80 \
            ${{ env.IMAGE_TAG_COMMIT }}
          echo "== Container started =="
          sleep 10
          docker ps

      - name: Wait for application to be ready
        run: |
          echo "=== Waiting for application to be ready ==="
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          echo "Application did not respond in time"
          exit 1

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a"
        continue-on-error: true

      - name: Rename ZAP report
        if: always()
        run: |
          if [ -f "report_json.json" ]; then
            mv report_json.json zap-scan-report.json
            echo "ZAP report renamed to zap-scan-report.json"
          else
            echo "ZAP report not found"
          fi

      - name: Upload ZAP scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap-scan-report.json
          retention-days: 7

      - name: Stop Docker container
        if: always()
        run: |
          echo "=== Stopping Docker container ==="
          docker stop akaunting-app || true
          docker rm akaunting-app || true

  nuclei-dast:
    name: DAST Security with Nuclei
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG_COMMIT: ${{ vars.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: ./

      - name: Load Docker image
        run: |
          echo "=== Loading Docker image for Nuclei scan ==="
          docker load -i docker-image.tar

      - name: Start Docker container
        run: |
          echo "=== Starting container for Nuclei ==="
          docker run -d \
            --name nuclei-app \
            -p 8081:80 \
            ${{ env.IMAGE_TAG_COMMIT }}
          sleep 10

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8081 > /dev/null; then
              echo "App ready for Nuclei"
              break
            fi
            sleep 2
          done

      - name: Install Nuclei
        run: |
          echo "=== Installing Nuclei ==="
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          sudo cp ~/go/bin/nuclei /usr/local/bin/
          nuclei -version

      - name: Update Nuclei templates
        run: |
          nuclei -update-templates

      - name: Run Nuclei scan
        run: |
          echo "=== Running Nuclei DAST scan ==="
          nuclei -u http://localhost:8081 \
            -severity medium,high,critical \
            -rate-limit 150 \
            -timeout 30 \
            -json-export nuclei-results.json || true

      - name: Format JSON report
        run: |
          echo "=== Formatting JSON report ==="
          if [ -s "nuclei-results.json" ]; then
            jq '.' "nuclei-results.json" > nuclei-dast-report.json
            echo "JSON report formatted"
          else
            echo '{"info": "No results found"}' > nuclei-dast-report.json
          fi

      - name: Upload Nuclei results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-dast-report
          path: nuclei-dast-report.json
          retention-days: 7

      - name: Stop container
        if: always()
        run: |
          docker stop nuclei-app || true
          docker rm nuclei-app || true

  upload-zap-to-defectdojo:
    name: Upload ZAP report to DefectDojo
    runs-on: ubuntu-latest
    needs: owasp-zap-dast
    if: always()

    steps:
      - name: Download ZAP report
        uses: actions/download-artifact@v4
        with:
          name: zap-scan-report
          path: ./

      - name: Upload ZAP report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "zap-scan-report.json" ]; then
            echo "Uploading ZAP report to DefectDojo..."
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=ZAP Scan" \
              -F "file=@zap-scan-report.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          else
            echo "ZAP report not found"
          fi

  upload-nuclei-to-defectdojo:
    name: Upload Nuclei report to DefectDojo
    runs-on: ubuntu-latest
    needs: nuclei-dast
    if: always()

    steps:
      - name: Download Nuclei report
        uses: actions/download-artifact@v4
        with:
          name: nuclei-dast-report
          path: ./

      - name: Upload Nuclei report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "nuclei-dast-report.json" ]; then
            echo "Uploading Nuclei report to DefectDojo..."
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=Nuclei Scan" \
              -F "file=@nuclei-dast-report.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          else
            echo "Nuclei report not found"
          fi