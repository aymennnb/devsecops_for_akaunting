nuclei-dast:
    name: DAST Security with Nuclei
    runs-on: ubuntu-latest
    needs: owasp-zap-dast
    continue-on-error: true

    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG_COMMIT: ${{ vars.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p "GitHub Actions/DAST Security/Reports/Nuclei"
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: ./

      - name: Load Docker image
        run: |
          echo "=== Loading Docker image for Nuclei scan ==="
          docker load -i docker-image.tar
      
      - name: Start Docker container
        run: |
          echo "=== Starting container for Nuclei ==="
          docker run -d \
            --name nuclei-app \
            -p 8081:80 \
            ${{ env.IMAGE_TAG_COMMIT }}
          sleep 10
      
      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8081 > /dev/null; then
              echo "App ready for Nuclei"
              break
            fi
            sleep 2
          done
      
      - name: Install Nuclei
        run: |
          echo "=== Installing Nuclei ==="
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          sudo cp ~/go/bin/nuclei /usr/local/bin/
          nuclei -version
      
      - name: Update Nuclei templates
        run: |
          nuclei -update-templates
      
      - name: Run Nuclei scan
        run: |
          echo "=== Running Nuclei DAST scan ==="
          nuclei -u http://localhost:8081 \
            -severity medium,high,critical \
            -rate-limit 150 \
            -timeout 30 \
            -o "GitHub Actions/DAST Security/Reports/Nuclei/nuclei-results.json" \
            -json
      
      - name: Format JSON report
        run: |
          echo "=== Formatting JSON report ==="
          if [ -s "GitHub Actions/DAST Security/Reports/Nuclei/nuclei-results.json" ]; then
            # Formatter le JSON pour qu'il soit lisible
            jq '.' "GitHub Actions/DAST Security/Reports/Nuclei/nuclei-results.json" > "GitHub Actions/DAST Security/Reports/nuclei-report.json"
            echo "JSON report formatted"
          else
            echo "No results found" > "GitHub Actions/DAST Security/Reports/nuclei-report.json"
          fi
      
      - name: Upload Nuclei results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-dast-results-${{ github.sha }}
          path: GitHub Actions/DAST Security/Reports/nuclei-report.json
          retention-days: 7
      
      - name: Stop container
        if: always()
        run: |
          docker stop nuclei-app || true
          docker rm nuclei-app || true