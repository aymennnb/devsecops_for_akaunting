name: Akaunting DevSecOps CI/CD

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write

on:
  push:
    branches: [main]

jobs:

  build:
    uses: ./.github/workflows/build.yml
    secrets:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

#  tests:
#    needs: build
#    uses: ./.github/workflows/tests.yml
#    secrets:
#      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
#      MYSQL_USER: ${{ secrets.MYSQL_USER }}
#      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
#      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

#  sast-security:
#    needs: [ build ]
#    uses: ./.github/workflows/sast-security.yml
#    secrets:
#      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
#      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  build-image:
    needs: [ sast-security ]
    uses: ./.github/workflows/build-image.yml
    secrets: inherit


  scan-trivy:
    needs: [ build-image ]
    uses: ./.github/workflows/scan-trivy.yml
    secrets: inherit

  push-to-dockerhub:
    needs: [ build-image, scan-trivy ]
    uses: ./.github/workflows/push-to-dockerhub.yml
    secrets: inherit
