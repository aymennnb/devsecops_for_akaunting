  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # needs: [semgrep-sast, sonarCloudScan, run-tests]
    needs: prepare
    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG_COMMIT: ${{ vars.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_TAG_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Save Docker image to tar file
        run: |
          echo "=== Sauvegarde de l'image Docker ==="
          docker save ${{ env.IMAGE_TAG_COMMIT }} -o docker-image.tar
          echo "== Image sauvegardée =="
          ls -lh docker-image.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: docker-image.tar
          retention-days: 1

  owasp-zap-dast:
    name: DAST Security with OWASP ZAP
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG_COMMIT: ${{ vars.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p "GitHub Actions/DAST Security/Reports"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: ./

      - name: Load Docker image
        run: |
          echo "=== Loading Docker image ==="
          docker load -i docker-image.tar
          echo "== Docker image loaded =="
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }}

      - name: Start Docker container
        run: |
          echo "=== Starting Docker container ==="
          docker run -d \
            --name akaunting-app \
            -p 8080:80 \
            ${{ env.IMAGE_TAG_COMMIT }}
          echo "== Container started =="
          sleep 10
          docker ps

      - name: Wait for application to be ready
        run: |
          echo "=== Waiting for application to be ready ==="
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi
            echo "Waiting... (attempt $i/30)"
            sleep 2
          done
          echo "Application did not respond in time"
          exit 1

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
        continue-on-error: true

      - name: Upload ZAP scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results-${{ github.sha }}
          path: |
            report_md.md
            report_html.html
          retention-days: 7

      - name: Stop Docker container
        if: always()
        run: |
          echo "=== Stopping Docker container ==="
          docker stop akaunting-app || true
          docker rm akaunting-app || true

