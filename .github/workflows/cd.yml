name: CD Akaunting Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string

env:
  AWS_REGION: us-east-1
  DOCKER_IMAGE: "aymen138/akaunting_devops_project"

jobs:
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create DynamoDB table if not exists
        run: |
          # Créer la table DynamoDB si elle n'existe pas
          if ! aws dynamodb describe-table --table-name terraform-lock --region us-east-1 2>/dev/null; then
            echo "Creating DynamoDB table for Terraform locking..."
            aws dynamodb create-table \
              --table-name terraform-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1
            sleep 10  # Attendre que la table soit créée
          else
            echo "DynamoDB table already exists"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          echo "== Deploying to AWS ECS =="
          terraform apply -auto-approve -var="docker_image_tag=${{ github.event.inputs.image_tag || 'latest' }}"

      - name: Verify ECS Service
        run: |
          echo "== Checking deployment =="
          sleep 30
          aws ecs describe-services \
            --cluster akaunting-cluster-production \
            --services akaunting-service-production \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status'
