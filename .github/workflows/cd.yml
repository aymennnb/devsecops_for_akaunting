name: CD Akaunting Pipeline

on:
  workflow_run:
    workflows: ["CI Akaunting pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  AWS_REGION: us-east-1
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  terraform-apply:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Deploy with Terraform
        working-directory: ./terraform
        env:
          TF_VAR_docker_image: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
        run: |
          echo "== Deploying complete infrastructure =="
          echo "Docker image: $TF_VAR_docker_image"

          # Apply en 2 étapes si nécessaire
          terraform apply -auto-approve -var="docker_image=$TF_VAR_docker_image"

      - name: Get deployment outputs
        working-directory: ./terraform
        run: |
          echo "== Deployment outputs =="
          terraform output

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS deployment
        run: |
          echo "== Verifying ECS deployment =="

          # Attendre un peu
          sleep 30

          # Vérifier le cluster
          echo "Cluster status:"
          aws ecs describe-clusters \
            --clusters akaunting-cluster \
            --region ${{ env.AWS_REGION }} \
            --query 'clusters[0].[clusterName, status, activeServicesCount]' \
            --output table

          # Vérifier le service
          echo "Service status:"
          aws ecs describe-services \
            --cluster akaunting-cluster \
            --services akaunting-service \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].[serviceName, status, runningCount, desiredCount]' \
            --output table

          # Vérifier les tasks
          echo "Running tasks:"
          aws ecs list-tasks \
            --cluster akaunting-cluster \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns' \
            --output table
