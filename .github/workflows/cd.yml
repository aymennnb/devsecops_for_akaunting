name: CD Pipeline - Deploy to AWS

on:
  workflow_run:
    workflows: ["CI Akaunting pipeline"]
    types:
      - completed

env:
  AWS_REGION: us-east-1
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}:latest

jobs:
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service with latest image
        run: |
          echo "== Updating ECS service with latest image =="

          # Mettre à jour la task definition avec la nouvelle image
          TASK_DEF=$(aws ecs describe-task-definition --task-definition akaunting-task --query 'taskDefinition')

          # Remplacer l'image dans la task definition
          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "${{ env.DOCKER_IMAGE }}" '.containerDefinitions[0].image = $IMAGE')

          # Enregistrer la nouvelle version
          echo $NEW_TASK_DEF > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

          # Mettre à jour le service
          aws ecs update-service \
            --cluster akaunting-cluster \
            --service akaunting-service \
            --task-definition akaunting-task \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          echo "== Waiting for deployment to complete =="
          aws ecs wait services-stable \
            --cluster akaunting-cluster \
            --services akaunting-service \
            --region ${{ env.AWS_REGION }}

          echo "== Deployment successful =="

      - name: Get service status
        run: |
          echo "== Service status =="
          aws ecs describe-services \
            --cluster akaunting-cluster \
            --services akaunting-service \
            --query 'services[0].[taskDefinition, deployments[0].status, deployments[0].updatedAt]' \
            --output table
