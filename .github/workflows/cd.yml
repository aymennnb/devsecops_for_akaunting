name: CD Akaunting Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: "akaunting"
  DOCKER_IMAGE: "aymen138/akaunting_devops_project"

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest || echo "Image not found, will build new one"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get current timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Generate image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-$(git rev-parse --short HEAD)-${{ steps.timestamp.outputs.timestamp }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }} ${{ env.DOCKER_IMAGE }}:latest

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Update Terraform variables with new image tag
        run: |
          echo "image_tag=${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_ENV
          echo "New image tag: ${{ needs.build-and-push.outputs.image_tag }}"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply with image update
        working-directory: ./terraform
        run: |
          echo "== Deploying image: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} =="
          terraform apply -auto-approve \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}"

      - name: Verify deployment
        run: |
          echo "== Deployment completed =="
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Application should be available soon"

      - name: Force ECS service update
        run: |
          # Force une nouvelle déploiement pour s'assurer que la nouvelle image est utilisée
          aws ecs update-service \
            --cluster akaunting-cluster \
            --service akaunting-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
