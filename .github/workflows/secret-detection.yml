name: Secrets Detection

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        required: true
        type: string
      DEFECTDOJO_ENGAGEMENT_ID:
        required: true
        type: string
    secrets:
      DEFECTDOJO_API_KEY:
        required: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GitLeaks scan
        run: |
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz"
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          ./gitleaks detect --source . --report-format json --report-path leaks.json --exit-code 0 || true

      - name: Upload GitLeaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: leaks.json
          retention-days: 7

  upload-to-defectdojo:
    runs-on: ubuntu-latest
    needs: gitleaks
    if: always()

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: ./

      - name: Upload to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          curl -X POST "$DD_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DD_API_KEY" \
            -F "engagement=$DD_ENGAGEMENT_ID" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@leaks.json" \
            -F "verified=true" \
            -F "active=true"