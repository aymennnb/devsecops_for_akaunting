name: Secrets Detection

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        required: true
        type: string
      DEFECTDOJO_ENGAGEMENT_ID:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true
      DEFECTDOJO_API_KEY:
        required: true

jobs:
  gitleaks:
    name: Secret Detection with GitLeaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          report-format: json
          report-path: "leaks.json"
          exit-code: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GitLeaks report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: leaks.json
          retention-days: 7
  
  upload-to-defectdojo:
    name: Upload to DefectDojo
    runs-on: ubuntu-latest
    needs: gitleaks
    if: always()

    steps:
      - name: Download GitLeaks report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: ./

      - name: Upload to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ inputs.DEFECTDOJO_URL }}  # Changé de vars à inputs
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}  # Changé de vars à inputs
        run: |
          echo "== Uploading GitLeaks results to DefectDojo =="
          
          if [ -f "leaks.json" ]; then
            echo "Found GitLeaks report"
            
            curl -X POST \
              "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "scan_type=Gitleaks Scan" \
              -F "file=@leaks.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "minimum_severity=Medium"
            
            echo "== GitLeaks results uploaded successfully =="
          else
            echo "GitLeaks report not found"
          fi