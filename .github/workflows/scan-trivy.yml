name: Scan Docker Image with Trivy

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        required: true
        type: string
      DEFECTDOJO_ENGAGEMENT_ID:
        required: true
        type: string
    secrets:
      DEFECTDOJO_API_KEY:
        required: true

jobs:
  scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}
          path: ./

      - name: Load Docker image from tar file
        run: |
          docker load -i docker-image.tar
          docker images

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.57.0

      - name: Download Trivy vulnerability database
        run: trivy image --download-db-only

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --format json --ignore-unfixed --vuln-type os,library --severity CRITICAL,HIGH,MEDIUM,LOW -o trivy-scan-report-${{ github.sha }}.json ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-scan-report-${{ github.sha }}.json
          retention-days: 7

  upload-trivy-to-defectdojo:
    name: Upload Trivy report to DefectDojo
    runs-on: ubuntu-latest
    needs: scan
    if: always()

    steps:
      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: ./

      - name: Upload Trivy report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "trivy-scan-report-${{ github.sha }}.json" ]; then
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=Trivy Scan" \
              -F "file=@trivy-scan-report-${{ github.sha }}.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          fi
