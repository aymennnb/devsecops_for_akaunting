name: SAST Security Workflow

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true

jobs:
  semgrep-sast:
    name: SAST Security with Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    outputs:
      scan-completed: ${{ steps.upload-reports.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create report directories
        run: |
          mkdir -p "GitHub Actions/SAST Security/Reports"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Run Semgrep General Scan
        id: semgrep-general
        run: |
          echo "== Scan général Semgrep... =="
          semgrep ci --config=auto --json > "GitHub Actions/SAST Security/Reports/semgrep-general.json" || true
          echo "== Scan général terminé =="
        continue-on-error: true

      - name: Run Semgrep OWASP Scan
        id: semgrep-owasp
        run: |
          echo "== Scan OWASP Semgrep... =="
          semgrep ci --config=p/owasp-top-ten --json > "GitHub Actions/SAST Security/Reports/semgrep-owasp.json" || true
          echo "== Scan OWASP terminé =="
        continue-on-error: true

      - name: Upload Semgrep reports
        id: upload-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-reports-${{ github.sha }}
          path: |
            GitHub Actions/SAST Security/Reports/
          retention-days: 7

  snyk-sast:
    name: Snyk SAST Security Scan
    runs-on: ubuntu-latest
    needs: semgrep-sast

    outputs:
      sarif-file: ${{ steps.generate-sarif.outputs.sarif-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run Snyk TEST with SARIF output
        id: generate-sarif
        uses: snyk/actions/php@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --sarif-file-output=snyk.sarif
          command: test

      - name: Run Snyk MONITOR to Dashboard
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor
