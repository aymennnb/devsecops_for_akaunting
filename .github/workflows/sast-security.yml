name: SAST Security Workflow

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        required: true
        type: string
      DEFECTDOJO_ENGAGEMENT_ID:
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true
      DEFECTDOJO_API_KEY:
        required: true

jobs:

  semgrep-sast:
    name: SAST Security with Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Run Semgrep General Scan
        id: semgrep-general
        run: |
          echo "== Scan général Semgrep... =="
          semgrep ci --config=auto --json > semgrep-general.json || true
          echo "== Scan général terminé =="
        continue-on-error: true

      - name: Run Semgrep OWASP Scan
        id: semgrep-owasp
        run: |
          echo "== Scan OWASP Semgrep... =="
          semgrep ci --config=p/owasp-top-ten --json > semgrep-owasp.json || true
          echo "== Scan OWASP terminé =="
        continue-on-error: true

      - name: Upload Semgrep General report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-general-report
          path: semgrep-general.json
          retention-days: 7

      - name: Upload Semgrep OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-owasp-report
          path: semgrep-owasp.json
          retention-days: 7

  snyk-sast:
    name: SAST Security with Snyk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run Snyk TEST with SARIF output
        id: generate-sarif
        uses: snyk/actions/php@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --sarif-file-output=snyk.sarif
          command: test

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sast-report
          path: snyk.sarif
          retention-days: 7

  sonarcloud-sast:
    name: SAST Security with SonarQubeCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find smallest PHP file
        run: |
          echo "=== Recherche du plus petit fichier PHP ==="
          find app/Http/Controllers -name "*.php" -type f -exec wc -l {} \; | sort -n | head -5
          mkdir -p minimal-scan
          if [ -f "app/Http/Controllers/HomeController.php" ]; then
            cp app/Http/Controllers/HomeController.php minimal-scan/
          else
            FIRST_FILE=$(find app/Http/Controllers -name "*.php" | head -1)
            cp "$FIRST_FILE" minimal-scan/
          fi
          echo "Fichier copié :"
          ls -la minimal-scan/

      - name: SonarQube Single File Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=aymennnb
            -Dsonar.projectKey=aymennnb_devsecops_for_akaunting
            -Dsonar.sources=minimal-scan
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.analysis.automaticAnalysis.disabled=true
            -Dsonar.qualitygate.wait=false

  upload-semgrep-to-defectdojo:
    name: Upload Semgrep reports to DefectDojo
    runs-on: ubuntu-latest
    needs: semgrep-sast
    if: always()

    steps:
      - name: Download Semgrep General report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-general-report
          path: ./

      - name: Download Semgrep OWASP report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-owasp-report
          path: ./

      - name: Upload Semgrep General report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "semgrep-general.json" ]; then
            echo "Uploading Semgrep General report to DefectDojo..."
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=Semgrep JSON Report" \
              -F "file=@semgrep-general.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          else
            echo "Semgrep General report not found"
          fi

      - name: Upload Semgrep OWASP report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "semgrep-owasp.json" ]; then
            echo "Uploading Semgrep OWASP report to DefectDojo..."
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=Semgrep JSON Report" \
              -F "file=@semgrep-owasp.json" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          else
            echo "Semgrep OWASP report not found"
          fi

  upload-snyk-to-defectdojo:
    name: Upload Snyk report to DefectDojo
    runs-on: ubuntu-latest
    needs: snyk-sast
    if: always()

    steps:
      - name: Download Snyk report
        uses: actions/download-artifact@v4
        with:
          name: snyk-sast-report
          path: ./

      - name: Upload Snyk report to DefectDojo
        env:
          DD_URL: ${{ inputs.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT_ID: ${{ inputs.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -f "snyk.sarif" ]; then
            echo "Uploading Snyk SARIF report to DefectDojo..."
            curl -X POST "$DD_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DD_API_KEY" \
              -F "engagement=$DD_ENGAGEMENT_ID" \
              -F "scan_type=Snyk Scan" \
              -F "file=@snyk.sarif" \
              -F "verified=true" \
              -F "active=true" \
              -F "close_old_findings=true" \
              -F "skip_duplicates=true"
          else
            echo "Snyk report not found"
          fi