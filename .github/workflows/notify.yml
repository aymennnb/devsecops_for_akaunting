name: Notify Slack

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      SMTP_SERVER:
        required: true
      SMTP_PORT:
        required: true
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      TEAM_EMAILS:
        required: true
      EMAIL_FROM:
        required: true

jobs:
  notify:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify Slack
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            EMOJI="🎉"
            STATUS="PASSED"
          else
            EMOJI="💥"
            STATUS="FAILED"
          fi
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${EMOJI} ${{ github.repository }} | ${{ github.ref_name }} | ${STATUS}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Details>\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
  
  send-team-email:
    name: Send Email to Team
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Team Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: "CI/CD Notification - ${{ github.repository }}"
          body: |
            ${{ job.status == 'success' && 'The CI/CD pipeline completed successfully.' || 'The CI/CD pipeline failed.' }}
            
            🔗 Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            📋 Details:
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ steps.sha.outputs.short_sha }}
            - Triggered by: ${{ github.actor }}
            - Workflow: ${{ github.workflow }}
            ${{ job.status == 'failure' && '- Status: FAILED - Please check the workflow logs for details.' || '' }}
            
            ---
            This is an automated notification from GitHub Actions.
          to: ${{ secrets.TEAM_EMAILS }}
          from: ${{ secrets.EMAIL_FROM }}